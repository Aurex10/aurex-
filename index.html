const stTxt=()=>({ok:"Guardado en el servidor",sub:"Guardando…",error:"Sin conexión"})[SY.st]||"";
function setSt(s){SY.st=s;const e=document.getElementById("syn");if(e){e.textContent="● "+stTxt();e.className="syn "+s}}
async function api(a,body,opt){opt=opt||{};const r=await fetch("api.php?a="+a+(opt.q||""),{method:"POST",headers:{"X-Token":TK||"","Content-Type":opt.raw?"application/octet-stream":"application/json"},body:opt.raw?opt.raw:JSON.stringify(body||{})});
if(opt.rawres){if(r.status==401){srvExpired();throw{auth:1}}return r}
let j=null;try{j=await r.json()}catch(e){}
if(r.status==401&&j&&j.auth){srvExpired();throw{auth:1}}
if(!r.ok)throw{msg:(j&&j.err)||"Error del servidor ("+r.status+")",status:r.status,j};return j}
function srvExpired(){if(!TK)return;TK=null;try{localStorage.removeItem("tk")}catch(e){}cur=null;login();setTimeout(()=>{const e=$("l_e");if(e)e.textContent="Tu sesión venció. Vuelve a entrar."},50)}
async function srvDetect(){if(!/^https?:$/.test(location.protocol))return false;try{const r=await fetch("api.php?a=ping",{cache:"no-store"}),j=await r.json();return !!(j&&j.srv)}catch(e){return false}}
const SK=()=>Object.keys(db).filter(k=>k!="users"&&k!="log");
const byId=l=>{if(!Array.isArray(l))return null;const m={};for(const it of l){if(!it||typeof it!="object"||it.id===undefined)return null;m[it.id]=it}return m};
const isO=x=>x&&typeof x=="object"&&!Array.isArray(x);
function merge3(base,mine,cur){const J=JSON.stringify,B=byId(base),M=byId(mine),C=byId(cur);
if(B&&M&&C){const res=[],seen={};mine.forEach(it=>{seen[it.id]=1;const chg=!B[it.id]||J(B[it.id])!==J(it);if(chg)res.push(it);else if(C[it.id])res.push(C[it.id]);else if(!B[it.id])res.push(it)});
return cur.filter(it=>!seen[it.id]&&(!B[it.id]||J(B[it.id])!==J(it))).concat(res)}
if(isO(base)&&isO(mine)&&isO(cur)){const r={...cur};new Set([...Object.keys(base),...Object.keys(mine)]).forEach(k=>{if(J(base[k])===J(mine[k]))return;if(!(k in mine))delete r[k];else r[k]=(isO(base[k])&&isO(mine[k])&&isO(cur[k]))?merge3(base[k],mine[k],cur[k]):mine[k]});return r}
return mine}
function srvApply(r){let chg=false;
Object.entries(r.keys||{}).forEach(([k,o])=>{SY.revs[k]=o.rev;if(SY.last[k]===o.v)return;let v;try{v=JSON.parse(o.v)}catch(e){return}
if(SY.last[k]!==undefined&&JSON.stringify(db[k])!==SY.last[k]){try{v=merge3(JSON.parse(SY.last[k]),db[k],v)}catch(e){}}
db[k]=v;SY.last[k]=o.v;chg=true});
if(r.users){db.users=r.users}
if(r.log&&db.log.length<=SY.logSent){db.log=r.log;SY.logSent=db.log.length;chg=true}
if(r.logn!==undefined)SY.logn=r.logn;
db=nrm0(db);SNAP=snapOf();return chg}
const nrm0=d=>{["log"].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});return d};
function srvPush(){if(!SRV||!TK)return;clearTimeout(SY.t);SY.t=setTimeout(srvRun,500)}
async function srvRun(){if(SY.busy){SY.again=true;return}if(!SRV||!TK)return;SY.busy=true;setSt("sub");let regen=false;
try{for(const k of SK()){let tries=0;while(tries++<4){const cs=JSON.stringify(db[k]);if(SY.last[k]===cs)break;
const r=await api("save",{key:k,v:cs,rev:SY.revs[k]||0}).catch(e=>{if(e&&e.status==403&&e.j&&e.j.perm){if(!SY.first)toast(e.msg);SY.last[k]=cs;return null}throw e});
if(!r)break;
if(r.conflict){const cur=JSON.parse(r.v),base=SY.last[k]!==undefined?JSON.parse(SY.last[k]):null;db[k]=base===null?cur:merge3(base,db[k],cur);SY.last[k]=r.v;SY.revs[k]=r.rev;regen=true;continue}
SY.revs[k]=r.rev;SY.last[k]=cs;break}}
if(db.log.length>SY.logSent){const e=db.log.slice(SY.logSent),n=db.log.length;const r=await api("log",{entries:e});SY.logSent=n;SY.logn=r.logn;if(SY.relog){SY.logn=-1;SY.relog=0}}
setSt("ok")}catch(e){if(!(e&&e.auth))setSt("error")}
SY.busy=false;if(regen)srvRefresh();if(SY.again){SY.again=false;srvPush()}}
function srvRefresh(){const a=document.activeElement;if((a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||document.getElementById("vw")||document.getElementById("ask")){setTimeout(srvRefresh,4000);return}try{if(cu()&&!cu().cambiar&&TK)go()}catch(e){}}
async function srvSync(){if(!SRV||!TK||!cur||SY.busy)return;try{const r=await api("sync",{revs:SY.revs,logn:SY.logn});const chg=srvApply(r);setSt("ok");if(chg)srvRefresh();else{const u=cu();if(!u){srvExpired()}}}catch(e){if(!(e&&e.auth))setSt("error")}}
async function srvEnter(){const r=await api("sync",{revs:{},logn:-1,full:1});
if(r.empty){const me=(r.users||[]).find(u=>u.u==cur);if(me&&me.rol=="admin"){await new Promise(ok=>ask("El servidor está vacío. ¿Subir los datos de este equipo al servidor para que todos los vean?",async()=>{try{const keys={};SK().forEach(k=>keys[k]=JSON.stringify(db[k]));await api("seed",{keys,log:db.log});}catch(e){}ok()},false,ok))}
else{db.users=r.users;SNAP=snapOf();SY.first=false;return}
const r2=await api("sync",{revs:{},logn:-1,full:1});SY.last={};SY.revs={};SY.logSent=1e9;srvApply(r2)}
else{SY.last={};SY.revs={};SY.logSent=1e9;srvApply(r)}
SY.logSent=db.log.length;
const me=(db.users||[]).find(u=>u.u==cur);
SK().forEach(k=>{if(SY.last[k]===undefined){if(me&&(me.rol=="gerencia"||me.rol=="acopiador"))SY.last[k]=JSON.stringify(db[k])}});
SNAP=snapOf();SY.first=false;srvPush()}

async function chkVer(){if(!SRV)return;try{const t=await (await fetch("index.html?cb="+Date.now(),{cache:"no-store"})).text();const m=t.match(/const BUILD="([^"]+)"/);if(m&&m[1]!==BUILD&&!document.getElementById("vbn")){const d=document.createElement("div");d.id="vbn";d.className="np";d.innerHTML='<span>Hay una versión nueva del sistema.</span><button onclick="location.reload()">Actualizar ahora</button><button class="g" style="color:#ccc;border-color:#555" onclick="this.parentNode.remove()">Después</button>';document.body.appendChild(d)}}catch(e){}}
setInterval(chkVer,90000);

(async()=>{SRV=await srvDetect();if(SRV){try{LGU=(await (await fetch("api.php?a=userlist",{cache:"no-store"})).json()).users}catch(e){}if(TK){try{const r=await api("me");cur=r.user.u;await srvEnter()}catch(e){cur=null;if(!(e&&e.auth)){TK=null}}}else cur=null;setInterval(srvSync,6000)}boot()})();
</script></body></html>
